services:
  db:
    image: postgres:16
    container_name: rust_project_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rust_dev}
      POSTGRES_USER: ${POSTGRES_USER:-rust_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rust_user} -d ${POSTGRES_DB:-rust_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
